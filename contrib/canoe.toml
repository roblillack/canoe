# Sample configuration for Canoe.
#
# Copy this file to ~/.config/canoe/canoe.toml and uncomment the settings you
# want to change. Every setting is optional; a commented-out setting shows the
# built-in default. Tables that are empty by default ([env], [hotkeys] and
# [[rules]]) show examples instead.
#
# After editing, send SIGHUP to reload (e.g. `pkill -HUP canoe`). If the file
# cannot be parsed, Canoe ignores all of it and uses the built-in defaults.
#
# See the Configuration section of the README for details.

# Modifier for the built-in shortcuts: "super" or "alt".
#main_modifier = "super"

# Which windows the window lists (Super+Tab, Super+` and the window menu of
# the desktop) show: "output" for those on the output the list opens on,
# "all" for the windows on every output.
#window_list_scope = "output"

# Programs Canoe launches. Each is a program name or an argv array. A plain
# string is not run through a shell, so pass arguments as an array, e.g.
# lock_cmd = ["swaylock", "-f", "-c", "000000"].
#launcher_cmd = "fuzzel"
#terminal_cmd = "foot"
#lock_cmd = "swaylock"

# Programs launched once when Canoe starts (not on reload). Empty by default.
# When one of them draws a wallpaper, set desktop_background = "transparent"
# under [ui] below.
#startup_cmds = ["mako", ["swaybg", "-i", "/home/me/bg.png"]]

# Cursor theme and size (in logical pixels) for cursors Canoe draws, also set
# as XCURSOR_THEME and XCURSOR_SIZE for programs Canoe launches. Unset by
# default: Canoe then uses XCURSOR_THEME/XCURSOR_SIZE from [env] or from its
# own environment, falling back to the "default" theme at size 24. A theme
# that is not installed (there is no "default" one on NixOS, for instance) is
# replaced by one that is, Adwaita for choice.
#xcursor_theme = "Adwaita"
#xcursor_size = 24

# X11 programs (through Xwayland) draw at the scale of the outputs, rounded
# up to a whole number, and are told so (Xft.dpi, XSETTINGS), so they're
# crisp on scaled outputs. Programs that can't scale themselves come out
# small. With false, they draw at scale 1 and are stretched: blurry, but at
# the size they'd have on an unscaled output.
#xwayland_hidpi = true

# Export WAYLAND_DISPLAY, XDG_CURRENT_DESKTOP, XDG_SESSION_TYPE and, if set,
# XCURSOR_THEME and XCURSOR_SIZE to the systemd user manager and D-Bus
# activation environment on startup (needed for screen sharing). Turn it off
# if something else manages the session environment.
#update_activation_environment = true

# Remember how the outputs are set up (with wdisplays, wlr-randr, ...) for
# each combination of connected monitors, and which one is primary, and set
# them up that way again when the combination comes back. Kept in
# ~/.local/state/canoe/outputs.toml. See "Multiple Outputs" in the README.
#remember_outputs = true

# Pretend to be sway and KWin for screenshot tools that only work with them
# (see Screenshots in the README). Changes apply on reload.
#
# emulate_sway answers sway's IPC on the socket SWAYSOCK names (set for
# programs Canoe launches): where outputs and windows are, which is focused.
# shotman needs it to capture the active window, grimshot for its active,
# window and output targets. Commands and events are not supported, so
# tools that drive sway or follow its events (e.g. waybar's sway modules)
# still won't work.
#emulate_sway = false
#
# emulate_kwin takes the name org.kde.KWin on the session bus and offers
# KWin's screenshot interface, which Spectacle needs. KDE programs may then
# take Canoe for KWin and try other KWin interfaces, which fail.
#emulate_kwin = false

# Environment variables for every program Canoe launches. Values must be
# strings: MOZ_ENABLE_WAYLAND = 1 (without quotes) is an error.
[env]
# Prefer Wayland, falling back to X11 if the Qt Wayland plugin is missing.
#QT_QPA_PLATFORM = "wayland;xcb"
# Let Electron apps run natively on Wayland.
#ELECTRON_OZONE_PLATFORM_HINT = "auto"
# Fix blank windows in Java apps running under Xwayland.
#_JAVA_AWT_WM_NONREPARENTING = "1"

# Key chords that spawn commands. A string value is split on whitespace; use
# an array if an argument contains spaces. A chord that matches a built-in
# shortcut overrides it.
[hotkeys]
#"Super+I" = "control-panel"
#"Super+E" = ["sh", "-c", "notify-send 'hi there' && foot"]

# Colors accept #RGB, #RRGGBB, #RRGGBBAA or "transparent". Sizes are in
# logical pixels.
[ui]
#border_width = 5
#border_active = { outer = "#000000", mid = "#C0C0C0", inner = "#000000" }
#border_inactive = { outer = "#000000", mid = "#C0C0C0", inner = "#000000" }
#titlebar_text_active = "#FFFFFF"
#titlebar_text_inactive = "#000000"
#titlebar_bg_active = "#000080"
#titlebar_bg_inactive = "#FFFFFF"
#titlebar_text_align = "center" # or "left"
#menu_bg = "#C0C0C0"
#menu_text = "#000000"
#menu_highlight_bg = "#000080"
#menu_highlight_text = "#FFFFFF"
#button_bg = "#C0C0C0"
#button_highlight = "#FFFFFF"
#button_shadow = "#808080"
#shadows_enabled = true         # when false, menus use a flat L-shaped shadow
#shadows_active_size = 25       # focused window and menus
#shadows_inactive_size = 12     # all other windows
#shadows_color = "#00000033"
#font_name = "sans"             # fontconfig pattern
#font_size = 15.0
# Use "transparent" when a program like swaybg draws the wallpaper; a fill
# would otherwise cover it after restarting Canoe or plugging in a monitor.
#desktop_background = "#008080"
#desktop_menu = true            # false: only icons take clicks, the rest go to the wallpaper
#icons_enabled = true           # show minimized windows as desktop icons
# Desktop icon labels default to values derived from the settings above:
#icons_font_name = "sans"       # default: font_name, at regular weight
#icons_font_size = 12.0         # default: font_size * 0.8
#icons_text = "#000000"         # default: menu_text
#icons_highlight_bg = "#000080" # default: menu_highlight_bg
#icons_highlight_text = "#FFFFFF" # default: menu_highlight_text
# Windows glide into place when maximized, snapped or restored, and shrink
# into their desktop icons when minimized.
#animations_enabled = true
#animations_duration = 150      # milliseconds; 0 turns animations off

# Window rules. There are none by default. A window matches a rule if its app
# ID matches any of match_app_id, match_app_id_prefix or app_id_regex, and it
# has all properties listed in match_props:
#   toplevel  - the window has no parent
#   csd_only  - the client does not support server-side decorations
# Rules can also match on title (exact) or title_regex.
#
# force_ssd = true makes Canoe draw its own decorations even for windows that
# only draw their own (csd_only, e.g. libadwaita apps).
#
# swallow_top hides the given number of pixels at the top of the window, e.g.
# to remove an app's own title bar. The right value depends on the app, its
# theme and font, so check it for each app before using it.
#[[rules]]
#match_app_id = ["firefox", "firefox-esr"]
#match_props = "toplevel"
#force_ssd = true
#swallow_top = 48
