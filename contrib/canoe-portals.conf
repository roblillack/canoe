# Portal backends for Canoe sessions (XDG_CURRENT_DESKTOP=canoe): screen
# sharing and screenshots through xdg-desktop-portal-wlr, everything else
# through xdg-desktop-portal-gtk.
#
# Install it for everyone as /usr/share/xdg-desktop-portal/canoe-portals.conf,
# or for yourself as ~/.config/xdg-desktop-portal/canoe-portals.conf.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
