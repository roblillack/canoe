[package]
name = "canoe"
version = "0.6.0"
edition = "2021"
description = "Canoe, a River window manager implementation in Rust"
license = "MIT"
repository = "https://github.com/roblillack/canoe"
homepage = "https://github.com/roblillack/canoe"

[package.metadata.release]
# Only ever cut a release from `main`.
allow-branch = ["main"]
pre-release-replacements = [
    # Roll CHANGELOG's [Unreleased] over to the new version and re-seed a fresh
    # [Unreleased] above it (the Keep a Changelog + cargo-release marker idiom).
    # Order matters: the version/date/compare substitutions run first, *then*
    # the markers re-insert the literal "Unreleased"/"ReleaseDate" tokens so the
    # next release finds them again.
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
    { file = "CHANGELOG.md", search = '\.\.\.HEAD', replace = "...{{tag_name}}", exactly = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}" },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/roblillack/canoe/compare/{{tag_name}}...HEAD", exactly = 1 },
]

[dependencies]
# Wayland client bindings
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
wayland-backend = "0.3"
wayland-scanner = "0.31"
bitflags = "2"

# XKB for keyboard handling
xkbcommon = "0.8"

# Signal handling and system
nix = { version = "0.29", features = ["signal", "process", "poll", "fs"] }

# For shared memory buffers passed to the compositor via wl_shm.
# Linux has memfd_create; other Unixes fall back to an unlinked tempfile
# (see target-specific sections below and src/canoe/shmfile.rs).
memmap2 = "0.9"

# Font rendering for titlebars
freetype = "0.7"
resvg = "0.42"
# Text shaping (ligatures, kerning, emoji sequences). Kept at the version
# resvg already pulls in, so it adds no new crates.
rustybuzz = "0.14"
unicode-properties = "0.1"
yeslogic-fontconfig-sys = "6"

# Regex for window rules
regex = "1"

# Error handling
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
memfd = "0.6"

[target.'cfg(not(any(target_os = "linux", target_os = "openbsd")))'.dependencies]
tempfile = "3"

[features]
# Compile in verbose debug logging / render timing (to stderr). Off by default.
debug-logging = []

[build-dependencies]
wayland-scanner = "0.31"

[[bin]]
name = "canoe"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
