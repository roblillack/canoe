[package]
name = "canoe"
version = "0.6.2"
edition = "2021"
description = "Canoe, a stacking Wayland compositor with Win 3.x looks"
license = "MIT"
repository = "https://github.com/roblillack/canoe"
homepage = "https://github.com/roblillack/canoe"

[package.metadata.release]
# Only ever cut a release from `main`.
allow-branch = ["main"]
pre-release-replacements = [
    # Roll CHANGELOG's [Unreleased] over to the new version and re-seed a fresh
    # [Unreleased] above it (the Keep a Changelog + cargo-release marker idiom).
    # Order matters: the version/date/compare substitutions run first, *then*
    # the markers re-insert the literal "Unreleased"/"ReleaseDate" tokens so the
    # next release finds them again.
    { file = "CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
    { file = "CHANGELOG.md", search = '\.\.\.HEAD', replace = "...{{tag_name}}", exactly = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}" },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/roblillack/canoe/compare/{{tag_name}}...HEAD", exactly = 1 },
]

[dependencies]
# The compositor itself. Backends that bind to Linux kernel interfaces
# (DRM/KMS, GBM, udev, libinput, libseat) are only pulled in on Linux; see
# the target-specific section at the bottom. The rest is cross-platform
# enough to let canoe build a winit-nested session on other Unixes
# (OpenBSD).
smithay = { version = "0.7", default-features = false, features = [
    "backend_egl",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "wayland_frontend",
    "xwayland",
] }
bitflags = "2"
# KDE protocols Smithay doesn't bundle (org_kde_plasma_shell)
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
# Bindings for protocols of canoe's own (xx-primary-output-v1)
wayland-scanner = "0.31"

# Cursor themes for the cursors the compositor draws
xcursor = "0.3"

# XKB for keyboard handling
xkbcommon = "0.8"

# Signal handling and system
nix = { version = "0.29", features = ["signal", "process", "poll", "fs"] }

# Font files are mapped rather than read
memmap2 = "0.9"

# Font rendering for titlebars
freetype = "0.7"
resvg = "0.42"
# Text shaping (ligatures, kerning, emoji sequences). Kept at the version
# resvg already pulls in, so it adds no new crates.
rustybuzz = "0.14"
unicode-properties = "0.1"
yeslogic-fontconfig-sys = "6"

# Regex for window rules
regex = "1"

# KWin's screenshot interface on the session bus (emulate_kwin), served from
# zbus's own thread; answers come back from the event loop through a oneshot
# channel.
zbus = "5"
futures-channel = "0.3"

# Replies of the sway IPC emulation (emulate_sway)
serde_json = "1"

# Error handling
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# DRM/KMS session backends (drm + gbm + libinput + libseat + udev
# enumeration). Always on for Linux; on OpenBSD opt in with the
# `openbsd-drm` feature below.
[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
] }

[features]
default = ["winit"]
# Running nested in a window of another session (canoe --backend winit),
# for development.
winit = ["smithay/backend_winit"]
# Compile in verbose debug logging / render timing (to stderr). Off by default.
debug-logging = []
# The DRM/KMS session backend (canoe --backend udev) on OpenBSD, via the
# libudev-openbsd shim + libinput-openbsd + seatd. Needs smithay with the
# patches in contrib/openbsd/, which no smithay release has yet; see
# tools/vendor-smithay-openbsd.sh. A no-op on Linux, where the backend is
# always built.
openbsd-drm = [
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_session_libseat",
]

[[bin]]
name = "canoe"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
